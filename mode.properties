sentence=Write Processing sketches in Lua — run them in the IDE, LOVE2D, or Roblox from the same file.
paragraph=Lua Mode lets you write sketches using the familiar Processing API — size(), ellipse(), mouseX, draw() — in Lua. Run them directly from the IDE via the bundled luamode-runner binary (no extra installs needed). Export the same sketch to LOVE2D or drop it into a Roblox LocalScript. Powered by tree-sitter for real-time syntax highlighting and instant error feedback.
