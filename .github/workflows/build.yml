name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']          # pushing a v* tag publishes a GitHub Release
  pull_request:
    branches: [master, main]

jobs:
  # ── Java mode JAR ────────────────────────────────────────────────────────
  # The jar is plain bytecode, identical on every OS, so build it once.
  java:
    name: Java
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Processing
        id: cache-processing
        uses: actions/cache@v5
        with:
          path: processing
          key: processing-4.3-linux

      - name: Download Processing (for pde/core jars)
        if: steps.cache-processing.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o processing.tgz \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir processing
          tar xzf processing.tgz -C processing --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          rm processing.tgz

      - name: Build native tree-sitter lib (Linux)
        run: native/build.sh lua

      - name: Test + Build mode JAR (no Rust)
        shell: bash
        env:
          SKIP_RUNNER: "1"
          PROCESSING_DIR: ${{ github.workspace }}/processing
        run: gradle test modeJar --no-daemon

      - name: Upload LuaMode.jar
        uses: actions/upload-artifact@v6
        with:
          name: LuaMode-jar
          path: mode/LuaMode.jar

  # ── tree-sitter native lib, one per platform ─────────────────────────────
  # native/build.sh compiles java-tree-sitter + tree-sitter + the Lua grammar
  # into one shared lib. Shipping all four in the jar means nobody installing
  # the mode needs a compiler.
  native:
    name: Native lib (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one platform failing shouldn't hide the others' results
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux-x86_64,   arch: x86_64 }
          - { os: macos-latest,   platform: macos-aarch64,  arch: aarch64 }
          - { os: macos-latest,   platform: macos-x86_64,   arch: x86_64 }   # cross-built on Apple Silicon
          - { os: windows-latest, platform: windows-x86_64, arch: x86_64 }   # MinGW g++, static runtime

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17 (JNI headers)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Git Bash on Windows needs a POSIX path for JAVA_HOME
          if command -v cygpath >/dev/null; then export JAVA_HOME=$(cygpath -u "$JAVA_HOME"); fi
          native/build.sh lua

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          # the common root is lib/, so the artifact keeps <platform>/<file>
          path: lib/*/*java-tree-sitter*
          if-no-files-found: error

  # ── Rust runner ──────────────────────────────────────────────────────────
  runner:
    name: Runner (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v5

      # runner/Cargo.toml depends on ../../RustMode, i.e. a RustMode checkout
      # next to this repo, the same layout as sketchbook/modes/ locally.
      - name: Check out RustMode engine
        shell: bash
        run: git clone --depth 1 https://github.com/pepc84/RustMode.git ../RustMode

      - name: Install X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('runner/Cargo.toml', 'runner/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build luamode-runner
        working-directory: runner
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: runner-${{ matrix.platform }}
          path: |
            runner/target/${{ matrix.target }}/release/luamode-runner
            runner/target/${{ matrix.target }}/release/luamode-runner.exe

  # ── Distribution ZIP ─────────────────────────────────────────────────────
  dist:
    name: Distribution ZIP
    needs: [java, native, runner]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Processing
        id: cache-processing-dist
        uses: actions/cache@v5
        with:
          path: processing
          key: processing-4.3-linux

      - name: Download Processing (for pde/core jars)
        if: steps.cache-processing-dist.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o processing.tgz \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir processing
          tar xzf processing.tgz -C processing --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          rm processing.tgz

      - name: Download native libs (all platforms)
        uses: actions/download-artifact@v6
        with:
          pattern: native-*
          path: lib/
          merge-multiple: true

      - name: Check every platform's native lib is there
        run: |
          for f in linux-x86_64/libjava-tree-sitter.so macos-aarch64/libjava-tree-sitter.dylib \
                   macos-x86_64/libjava-tree-sitter.dylib windows-x86_64/java-tree-sitter.dll; do
            test -s "lib/$f" || { echo "missing lib/$f"; exit 1; }
            echo "ok lib/$f"
          done

      - name: Download runner binaries
        uses: actions/download-artifact@v6
        with:
          pattern: runner-*
          path: runners/

      - name: Stage runner binaries
        run: |
          mkdir -p mode/runner/linux-x86_64
          mkdir -p mode/runner/macos-x86_64
          mkdir -p mode/runner/macos-aarch64
          mkdir -p mode/runner/windows-x86_64

          cp runners/runner-linux-x86_64/luamode-runner   mode/runner/linux-x86_64/
          cp runners/runner-macos-x86_64/luamode-runner   mode/runner/macos-x86_64/
          cp runners/runner-macos-aarch64/luamode-runner  mode/runner/macos-aarch64/
          cp runners/runner-windows-x86_64/luamode-runner.exe mode/runner/windows-x86_64/

          chmod +x mode/runner/linux-x86_64/luamode-runner
          chmod +x mode/runner/macos-x86_64/luamode-runner
          chmod +x mode/runner/macos-aarch64/luamode-runner

      - name: Build distribution ZIP
        env:
          SKIP_RUNNER: "1"
          PROCESSING_DIR: ${{ github.workspace }}/processing
        run: gradle dist --no-daemon

      - name: Upload ZIP
        uses: actions/upload-artifact@v6
        with:
          name: LuaMode-dist
          path: build/distributions/LuaMode-*.zip

  # ── GitHub Release (on v* tags) ──────────────────────────────────────────
  # The ZIP has the mode jar, all four native libs and all four runners, so
  # users unzip it into sketchbook/modes/ and never compile anything.
  release:
    name: Release
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ZIP
        uses: actions/download-artifact@v6
        with:
          name: LuaMode-dist
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "LuaMode $GITHUB_REF_NAME" --generate-notes
